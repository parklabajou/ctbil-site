<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · CTBiL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#002F6C;--blue:#0072CE;--blue2:#0A5DBE;--sky:#9BCBEB;--gold:#B08D3C;--ink:#10233F;--bg:#F6F8FB;--surface:#fff;--line:#E4E9F0;--muted:#5A6675}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
  .wrap{max-width:960px;margin:0 auto;padding:0 28px}
  .phead{background:linear-gradient(100deg,rgba(0,23,58,.90),rgba(0,31,78,.72) 48%,rgba(9,58,140,.46)),url('images/hero-banner.png') center 34%/cover;color:#fff;padding:64px 0 56px;position:relative;overflow:hidden}
  .phead::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;background:radial-gradient(circle,rgba(155,203,235,.35),transparent 68%);border-radius:50%}
  .phead .wrap{position:relative;z-index:1}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--sky)}
  .phead h1{font-size:clamp(30px,4.4vw,44px);font-weight:600;margin:12px 0 10px}
  .phead p{color:#D6E3F2;max-width:600px;font-size:15.5px}
  .tags{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
  .tags a{text-decoration:none;cursor:pointer;transition:background .18s ease,transform .18s ease}
  .tags a:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
  .tags a.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 4px 14px rgba(176,141,60,.45);pointer-events:none}
  .tags a{font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:6px 15px;border-radius:22px}
</style>
</head>
<body>
<header class="phead">
  <div class="wrap">
    <div class="kick">Gallery</div>
    <h1>Life at CTBiL</h1>
    <p>Moments from the lab — everyday research life, conferences and seminars, and the celebrations we share along the way.</p>
    <div class="tags"><a href="https://ctbi.ajou.ac.kr/gallery/conferences" target="_blank" data-k="conference">Conference</a><a href="https://ctbi.ajou.ac.kr/gallery/anniversary" target="_blank" data-k="anniversary">Anniversary</a><a href="https://ctbi.ajou.ac.kr/gallery/lab-activity" target="_blank" data-k="lab-activity">Lab activity</a></div>
  </div>
</header>
<script>
/* 임베드 주소 뒤에 ?active=conference | anniversary | lab-activity 를 붙이면 해당 태그가 금색으로 표시됩니다 */
(function(){
  var a=(new URLSearchParams(location.search).get('active')||'').toLowerCase();
  document.querySelectorAll('.tags a').forEach(function(el){if(el.dataset.k===a)el.classList.add('on')});
})();
</script>
</body>
</html>
