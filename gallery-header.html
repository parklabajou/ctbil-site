<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · CTBiL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002F6C; --blue:#0072CE; --blue2:#0A5DBE; --blue-wash:#EAF3FC; --sky:#9BCBEB;
    --gold:#B08D3C; --gold-ink:#7D6220; --gold-wash:#F7F0DF;
    --ink:#10233F; --muted:#5A6675; --faint:#97A1AE; --line:#E4E9F0; --soft:#F6F8FB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#fff;line-height:1.65;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Space Grotesk','Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:-.02em}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .wrap{max-width:1040px;margin:0 auto;padding:0 28px}
  .kick{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--blue)}
  .kick::before{content:"";width:26px;height:3px;border-radius:2px;background:var(--gold)}
  footer{margin-top:80px;border-top:1px solid var(--line);background:#fff;color:var(--muted);padding:30px 0;font-size:13px;text-align:center}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important}
  }
  /* ---------- Page header (간결한 흰 배경 헤더) ---------- */
  .phead{background:#fff;padding:52px 0 40px;border-bottom:1px solid var(--line)}
  .phead-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:48px;align-items:center}
  .phead-in.noimg{grid-template-columns:1fr}
  .phead h1{font-size:clamp(30px,4.2vw,42px);font-weight:600;color:var(--navy);line-height:1.15;margin:14px 0 10px}
  .phead p{color:var(--muted);max-width:520px;font-size:16px}
  .phead-img{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
  .phead-img img{width:100%;height:100%;object-fit:cover;display:block}
  @media (max-width:820px){
    .phead{padding:36px 0 32px}
    .phead-in{grid-template-columns:1fr;gap:24px}
  }
  .phead{border-bottom:0}
  .tags{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
  .tags a{font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:999px;transition:border-color .15s,color .15s,transform .15s}
  .tags a:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
  .tags a.on{background:var(--navy);border-color:var(--navy);color:#fff;pointer-events:none}

</style>
</head>
<body>

<!-- 갤러리 페이지 맨 위에 붙이는 제목 띠예요. 사진 자체는 구글 사이트의 갤러리 하위 페이지에 있어요.
     아래 태그 링크의 주소는 구글 사이트 하위 페이지 주소고, 임베드 주소 뒤에
     ?active=conference | anniversary | lab-activity 를 붙이면 그 태그가 남색으로 표시돼요.
     태그를 추가하려면 <a> 한 줄을 복사해서 href 와 data-k, 글자를 바꾸세요. -->
<header class="phead">
  <div class="wrap phead-in">
    <div>
      <div class="kick">Gallery</div>
      <h1>Life at CTBiL</h1>
      <p>Moments from the lab — everyday research life, conferences and seminars, and the celebrations we share along the way.</p>
      <div class="tags">
        <a href="https://ctbi.ajou.ac.kr/gallery/conferences" target="_blank" rel="noopener" data-k="conference">Conference</a>
        <a href="https://ctbi.ajou.ac.kr/gallery/anniversary" target="_blank" rel="noopener" data-k="anniversary">Anniversary</a>
        <a href="https://ctbi.ajou.ac.kr/gallery/lab-activity" target="_blank" rel="noopener" data-k="lab-activity">Lab activity</a>
      </div>
    </div>
    <div class="phead-img"><img src="images/hero-banner.png" alt="" onerror="var w=this.closest('.phead-in');if(w)w.classList.add('noimg');if(this.parentNode)this.parentNode.remove()"></div>
  </div>
</header>

<script>
/* 주소 뒤의 ?active= 값과 같은 태그를 남색으로 표시해요. 건드리지 않아도 됩니다. */
(function(){
  var a = (new URLSearchParams(location.search).get('active') || '').toLowerCase();
  [].forEach.call(document.querySelectorAll('.tags a'), function(el){ if(el.getAttribute('data-k') === a) el.classList.add('on'); });
})();
</script>
</body>
</html>
