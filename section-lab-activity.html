<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#002F6C;--blue:#0072CE;--blue2:#0A5DBE;--gold:#B08D3C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;align-items:center;padding:18px 16px;min-height:100vh}
  .sec{display:inline-flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;
       font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.01em;color:#fff;
       background:linear-gradient(135deg,var(--navy),var(--blue2) 75%,var(--blue));
       padding:16px 40px;border-radius:44px;box-shadow:0 8px 24px rgba(0,47,108,.28);
       transition:transform .18s ease,box-shadow .18s ease}
  .sec::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--gold)}
  .sec:hover{transform:scale(1.045);box-shadow:0 14px 34px rgba(0,47,108,.38)}
</style>
</head>
<body>
  <a class="sec" href="#">Lab Activity</a>
</body>
</html>
