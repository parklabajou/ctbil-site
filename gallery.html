<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · CTBiL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#002F6C;--blue:#0072CE;--blue2:#0A5DBE;--sky:#9BCBEB;--gold:#B08D3C;--ink:#10233F;--bg:#F6F8FB;--surface:#fff;--line:#E4E9F0;--muted:#5A6675}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  .phead{background:linear-gradient(135deg,var(--navy),var(--blue2) 70%,var(--blue));color:#fff;padding:64px 0 56px;position:relative;overflow:hidden}
  .phead::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;background:radial-gradient(circle,rgba(155,203,235,.35),transparent 68%);border-radius:50%}
  .phead .wrap{position:relative;z-index:1}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--sky)}
  .phead h1{font-size:clamp(30px,4.4vw,44px);font-weight:600;margin:12px 0 10px}
  .phead p{color:#D6E3F2;max-width:560px;font-size:15.5px}

  main{padding:44px 0 80px}
  /* masonry via CSS columns */
  .grid{column-count:3;column-gap:16px}
  @media(max-width:820px){.grid{column-count:2}}
  @media(max-width:520px){.grid{column-count:1}}
  .tile{break-inside:avoid;margin-bottom:16px;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;background:#dfe6ef;box-shadow:0 2px 10px rgba(16,35,63,.06);transition:transform .18s ease,box-shadow .18s ease}
  .tile:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(16,35,63,.14)}
  .tile img{width:100%;display:block}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 13px;color:#fff;font-size:13px;font-weight:500;background:linear-gradient(0deg,rgba(0,20,50,.82),transparent);opacity:0;transition:opacity .18s ease}
  .tile:hover .cap{opacity:1}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(6,16,34,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:30px}
  .lb.open{display:flex}
  .lb img{max-width:92vw;max-height:82vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#dfeaf7;font-size:14px}
  .lb .x{position:absolute;top:22px;right:26px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb .prev{left:24px} .lb .next{right:24px}

  footer{background:#0A1B33;color:#9FB4CE;padding:32px 0;font-size:13px;text-align:center}
</style>
</head>
<body>

<header class="phead">
  <div class="wrap">
    <div class="kick">Gallery</div>
    <h1>Life in the Lab</h1>
    <p>Conferences, experiments, celebrations, and the people behind the science.</p>
  </div>
</header>

<main><div class="wrap"><div class="grid" id="grid"></div></div></main>

<div class="lb" id="lb">
  <div class="x" onclick="closeLb()">✕</div>
  <div class="nav prev" onclick="step(-1)">‹</div>
  <div class="nav next" onclick="step(1)">›</div>
  <img id="lb-img" src="" alt="">
  <div class="cap" id="lb-cap"></div>
</div>

<footer>© 2026 Cell Therapy &amp; Bioinformatics Lab, Ajou University</footer>

<script>
/* 미리보기용 내장 플레이스홀더 생성기 (실제 사진으로 교체하면 지워도 됩니다) */
function ph(h,label,c1,c2){
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='600' height='"+h+"'>"+
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>"+
    "<stop offset='0' stop-color='"+c1+"'/><stop offset='1' stop-color='"+c2+"'/></linearGradient></defs>"+
    "<rect width='600' height='"+h+"' fill='url(#g)'/>"+
    "<text x='50%' y='50%' font-family='Inter,sans-serif' font-size='24' font-weight='600' "+
    "fill='rgba(255,255,255,.92)' text-anchor='middle' dominant-baseline='middle'>"+label+"</text></svg>";
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
/* ===================================================================
   ▼▼▼  갤러리 사진 — 여기만 수정하면 됩니다  ▼▼▼
   사진 추가 방법:
   1) GitHub 저장소에 images 폴더를 만들고 사진 파일을 올립니다.
   2) 아래 목록의 src 를 실제 사진 주소로 바꾸세요. 예:
      { src:"images/isscr2026.jpg", cap:"ISSCR 2026, Montreal" }
   * 지금 src의 ph(...) 는 미리보기용 임시 그림입니다. 실제 사진 주소로 교체하세요.
   =================================================================== */
const PHOTOS = [
  { src:ph(750,"ISSCR 2026, Montreal","#002F6C","#0072CE"), cap:"ISSCR 2026, Montreal" },
  { src:ph(420,"Lab dinner","#0A5DBE","#9BCBEB"), cap:"Lab dinner, Spring 2026" },
  { src:ph(600,"Confocal imaging","#0072CE","#002F6C"), cap:"Confocal imaging session" },
  { src:ph(500,"Poster award","#B08D3C","#0A5DBE"), cap:"Poster award ceremony" },
  { src:ph(720,"Organoid room","#002F6C","#0A5DBE"), cap:"Organoid culture room" },
  { src:ph(440,"Group hike","#0072CE","#9BCBEB"), cap:"Group hike, Suwon" },
  { src:ph(560,"KSTERM","#0A5DBE","#002F6C"), cap:"KSTERM conference" },
  { src:ph(640,"New members","#0072CE","#B08D3C"), cap:"New members welcome" },
  { src:ph(480,"Workshop","#002F6C","#0072CE"), cap:"Cell therapy workshop" },
];
/* ▲▲▲  갤러리 사진 끝  ▲▲▲ */

/* ---- 렌더링 + 라이트박스 (수정 불필요) ---- */
const grid=document.getElementById('grid');
PHOTOS.forEach((p,i)=>{
  const t=document.createElement('div'); t.className='tile'; t.onclick=()=>openLb(i);
  t.innerHTML=`<img src="${p.src}" alt="${p.cap}" loading="lazy"><div class="cap">${p.cap}</div>`;
  grid.appendChild(t);
});
let cur=0;
const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'), lbCap=document.getElementById('lb-cap');
function openLb(i){cur=i;show();lb.classList.add('open')}
function closeLb(){lb.classList.remove('open')}
function step(d){cur=(cur+d+PHOTOS.length)%PHOTOS.length;show()}
function show(){lbImg.src=PHOTOS[cur].src;lbCap.textContent=PHOTOS[cur].cap}
lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
</script>
</body>
</html>
